<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura POS - Manage Customers</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Shared CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">A</div>
        <span class="logo-text">Aura POS</span>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a href="customers.html" class="nav-link active">
          <i class="bi bi-people-fill"></i>
          <span>Customers</span>
        </a>
        <a href="items.html" class="nav-link">
          <i class="bi bi-box-seam-fill"></i>
          <span>Items</span>
        </a>
        <a href="orders.html" class="nav-link">
          <i class="bi bi-cart-fill"></i>
          <span>Place Order</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar">AD</div>
        <div class="user-info">
          <span class="user-name">Admin User</span>
          <span class="user-role">Manager</span>
        </div>
        <a href="login.html" class="logout-btn" title="Logout">
          <i class="bi bi-box-arrow-right" style="font-size: 1.15rem;"></i>
        </a>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Header -->
      <header class="main-header">
        <div class="header-title">
          <h1>Customer Management</h1>
        </div>
        
        <div class="header-actions">
          <div class="search-bar">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search customers...">
          </div>
          
          <div class="header-date">
            <i class="bi bi-calendar3"></i>
            <span>July 14, 2026</span>
          </div>

          <button class="header-btn" title="Notifications">
            <i class="bi bi-bell-fill"></i>
            <span class="notification-badge">3</span>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        <div class="page-layout-split">
          
          <!-- Customer Form Card (Left) -->
          <div class="card" style="position: sticky; top: 0;">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
              <i class="bi bi-person-plus-fill" style="color: var(--primary);"></i> Add / Update Customer
            </h3>
            
            <form onsubmit="event.preventDefault();">
              <div class="form-group">
                <label for="cust-id">Customer ID</label>
                <input type="text" id="cust-id" class="form-control" value="CUST-005" readonly style="background-color: var(--bg-secondary); color: var(--text-muted); cursor: not-allowed; font-weight: bold;">
              </div>

              <div class="form-group">
                <label for="cust-name">Full Name</label>
                <input type="text" id="cust-name" class="form-control" placeholder="e.g. Kasun Perera" required>
              </div>

              <div class="form-group">
                <label for="cust-email">Email Address</label>
                <input type="email" id="cust-email" class="form-control" placeholder="e.g. kasun@gmail.com" required>
              </div>

              <div class="form-group">
                <label for="cust-contact">Contact Number</label>
                <input type="tel" id="cust-contact" class="form-control" placeholder="e.g. 0771234567" required>
              </div>

              <div class="form-group">
                <label for="cust-address">Address</label>
                <textarea id="cust-address" class="form-control" rows="3" placeholder="e.g. Colombo, Sri Lanka" style="resize: none;"></textarea>
              </div>

              <div class="form-group">
                <label for="cust-status">Status</label>
                <select id="cust-status" class="form-control">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>

              <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Customer</button>
                <button type="reset" class="btn btn-secondary" style="width: 80px;">Clear</button>
              </div>
            </form>
          </div>

          <!-- Customer Directory (Right) -->
          <div class="table-container">
            <div class="table-header">
              <h3>Customer Registry</h3>
              <div style="display: flex; gap: 0.5rem; flex: 1; max-width: 320px;">
                <div class="search-bar" style="width: 100%; height: 35px; padding: 0.25rem 0.75rem;">
                  <i class="bi bi-funnel"></i>
                  <input type="text" id="customer-search" placeholder="Filter by name or city..." onkeyup="renderCustomers()">
                </div>
              </div>
            </div>
            
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th style="text-align: right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="customer-table-body">
                  <!-- Dynamic rows will be injected here -->
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script>
    let customers = JSON.parse(localStorage.getItem('customers')) || [];
    let editingId = null;

    function generateId() {
      if (customers.length === 0) return 'CUST-001';
      const lastId = customers[customers.length - 1].id;
      const num = parseInt(lastId.split('-')[1]) + 1;
      return 'CUST-' + num.toString().padStart(3, '0');
    }

    function initForm() {
      document.getElementById('cust-id').value = generateId();
      document.getElementById('cust-name').value = '';
      document.getElementById('cust-email').value = '';
      document.getElementById('cust-contact').value = '';
      document.getElementById('cust-address').value = '';
      document.getElementById('cust-status').value = 'active';
      editingId = null;
    }

    function saveCustomer() {
      const id = document.getElementById('cust-id').value;
      const name = document.getElementById('cust-name').value;
      const email = document.getElementById('cust-email').value;
      const contact = document.getElementById('cust-contact').value;
      const address = document.getElementById('cust-address').value;
      const status = document.getElementById('cust-status').value;

      if (!name || !contact) return alert('Name and contact are required.');

      if (editingId) {
        const index = customers.findIndex(c => c.id === editingId);
        if (index !== -1) {
          customers[index] = { id, name, email, contact, address, status };
        }
      } else {
        customers.push({ id, name, email, contact, address, status });
      }

      localStorage.setItem('customers', JSON.stringify(customers));
      initForm();
      renderCustomers();
    }

    function editCustomer(id) {
      const cust = customers.find(c => c.id === id);
      if (cust) {
        document.getElementById('cust-id').value = cust.id;
        document.getElementById('cust-name').value = cust.name;
        document.getElementById('cust-email').value = cust.email;
        document.getElementById('cust-contact').value = cust.contact;
        document.getElementById('cust-address').value = cust.address;
        document.getElementById('cust-status').value = cust.status;
        editingId = cust.id;
      }
    }

    function deleteCustomer(id) {
      if (confirm('Are you sure you want to delete this customer?')) {
        customers = customers.filter(c => c.id !== id);
        localStorage.setItem('customers', JSON.stringify(customers));
        renderCustomers();
      }
    }

    function renderCustomers() {
      const tbody = document.getElementById('customer-table-body');
      const searchQuery = document.getElementById('customer-search').value.toLowerCase();
      tbody.innerHTML = '';
      
      const filtered = customers.filter(c => 
        c.name.toLowerCase().includes(searchQuery) || 
        c.address.toLowerCase().includes(searchQuery) ||
        c.contact.toLowerCase().includes(searchQuery)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">No customers found.</td></tr>';
        return;
      }

      filtered.forEach(c => {
        const badgeClass = c.status === 'active' ? 'badge-success' : 'badge-warning';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight: 700; color: var(--text-primary);">${c.id}</td>
          <td>${c.name}</td>
          <td style="color: var(--text-secondary);">${c.email}</td>
          <td>${c.contact}</td>
          <td>${c.address}</td>
          <td><span class="badge ${badgeClass}">${c.status}</span></td>
          <td style="text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button onclick="editCustomer('${c.id}')" class="btn btn-secondary btn-sm btn-icon" title="Edit"><i class="bi bi-pencil-fill"></i></button>
            <button onclick="deleteCustomer('${c.id}')" class="btn btn-secondary btn-sm btn-icon" title="Delete" style="color: var(--text-primary); border-color: var(--text-primary);"><i class="bi bi-trash-fill"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.querySelector('form').onsubmit = (e) => {
      e.preventDefault();
      saveCustomer();
    };

    document.querySelector('form').onreset = () => {
      setTimeout(initForm, 0);
    };

    // Initialize
    initForm();
    renderCustomers();
  </script>
</body>
</html>
