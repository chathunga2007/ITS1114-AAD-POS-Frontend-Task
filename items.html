<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimsara POS - Manage Items</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
        <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">B</div>
        <span class="logo-text">Bimsara POS</span>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a href="customers.html" class="nav-link">
          <i class="bi bi-people-fill"></i>
          <span>Customers</span>
        </a>
        <a href="items.html" class="nav-link active">
          <i class="bi bi-box-seam-fill"></i>
          <span>Items</span>
        </a>
        <a href="orders.html" class="nav-link">
          <i class="bi bi-cart-fill"></i>
          <span>Place Order</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar">AD</div>
        <div class="user-info">
          <span class="user-name">Admin User</span>
          <span class="user-role">Manager</span>
        </div>
        <a href="login.html" class="logout-btn" title="Logout">
          <i class="bi bi-box-arrow-right" style="font-size: 1.15rem;"></i>
        </a>
      </div>
    </aside>

        <div class="main-wrapper">
            <header class="main-header">
        <div class="header-title">
          <h1>Item Management</h1>
        </div>
        
        <div class="header-actions">
          <div class="search-bar">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search items...">
          </div>
          
          <div class="header-date">
            <i class="bi bi-calendar3"></i>
            <span>July 14, 2026</span>
          </div>

          <button class="header-btn" title="Notifications">
            <i class="bi bi-bell-fill"></i>
            <span class="notification-badge">3</span>
          </button>
        </div>
      </header>

            <main class="page-content">
        <div class="page-layout-split">
          
                    <div class="card" style="position: sticky; top: 0;">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
              <i class="bi bi-box-seam-fill" style="color: var(--primary);"></i> Add / Update Item
            </h3>
            
            <form onsubmit="event.preventDefault();">
              <div class="form-group">
                <label for="item-code">Item Code</label>
                <input type="text" id="item-code" class="form-control" value="ITEM-009" readonly style="background-color: var(--bg-secondary); color: var(--text-muted); cursor: not-allowed; font-weight: bold;">
              </div>

              <div class="form-group">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" class="form-control" placeholder="e.g. Ergonomic Office Chair" required>
              </div>

              <div class="form-group">
                <label for="item-category">Category</label>
                <select id="item-category" class="form-control">
                  <option value="electronics">Electronics</option>
                  <option value="accessories">Accessories</option>
                  <option value="office">Office Furniture</option>
                  <option value="stationery">Stationery</option>
                </select>
              </div>

              <div class="grid grid-cols-2" style="gap: 1rem; margin-bottom: 0.25rem;">
                <div class="form-group" style="margin-bottom: 0;">
                  <label for="item-price">Unit Price ($)</label>
                  <input type="number" id="item-price" class="form-control" placeholder="e.g. 89.99" step="0.01" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                  <label for="item-qty">Qty On Hand</label>
                  <input type="number" id="item-qty" class="form-control" placeholder="e.g. 50" required>
                </div>
              </div>

              <div class="form-group" style="margin-top: 1rem;">
                <label for="item-desc">Description</label>
                <textarea id="item-desc" class="form-control" rows="3" placeholder="Enter item specifications..." style="resize: none;"></textarea>
              </div>

              <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap;">
                <button type="submit" class="btn btn-primary" style="flex: 1; min-width: 80px;">Save</button>
                <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 80px; border-color: var(--primary); color: var(--primary);">Update</button>
                <button type="button" class="btn btn-secondary" style="flex: 1; min-width: 80px; border-color: var(--danger); color: var(--danger);">Delete</button>
                <button type="reset" class="btn btn-secondary" style="flex: 1; min-width: 80px;">Clear</button>
              </div>
            </form>
          </div>

                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.1rem; font-weight: 700;">Product Catalog</h3>
              <div style="display: flex; gap: 0.75rem;">
                <input type="text" id="item-search" class="form-control" placeholder="Search items..." style="padding: 0.25rem 0.75rem; font-size: 0.85rem;" onkeyup="renderItems()">
                <select class="form-control" style="width: auto; padding: 0.25rem 2rem 0.25rem 0.75rem; font-size: 0.85rem; background-color: var(--bg-surface);">
                  <option value="all">All Categories</option>
                  <option value="electronics">Electronics</option>
                  <option value="accessories">Accessories</option>
                  <option value="office">Office Furniture</option>
                  <option value="stationery">Stationery</option>
                </select>
              </div>
            </div>
              <div class="grid grid-cols-3"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

</body>
</html>
