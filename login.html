<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimsara POS - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-secondary); margin: 0; font-family: var(--font-sans);">

  <div style="background-color: var(--bg-surface); padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); width: 100%; max-width: 400px; border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem;">
        <div class="logo-icon" style="width: 3rem; height: 3rem; font-size: 1.5rem;">B</div>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">Welcome Back</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Please enter your credentials to sign in</p>
    </div>

    <form action="dashboard.html" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label for="username" style="margin-bottom: 0.5rem; display: block; font-weight: 500;">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
      </div>

      <div class="form-group" style="margin-top: 1rem;">
        <label for="password" style="margin-bottom: 0.5rem; display: block; font-weight: 500;">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; border-radius: var(--radius-md); margin-top: 1.5rem;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
      Bimsara POS v1.0.0 &copy; 2026. All rights reserved.
    </div>
  </div>

</body>
</html>
