<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura POS - Login</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Shared CSS -->
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Clean monochrome login */
  </style>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <div class="logo-icon">A</div>
          <span class="logo-text">Aura POS</span>
        </div>
        <h2>Welcome Back</h2>
        <p>Please enter your credentials to sign in</p>
      </div>

      <form action="dashboard.html" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <div style="position: relative; display: flex; align-items: center;">
            <i class="bi bi-person-fill" style="position: absolute; left: 0.85rem; color: var(--text-muted); font-size: 1rem;"></i>
            <input type="text" id="username" class="form-control" placeholder="Enter your username" required style="padding-left: 2.5rem; width: 100%;">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <i class="bi bi-lock-fill" style="position: absolute; left: 0.85rem; color: var(--text-muted); font-size: 1rem;"></i>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required style="padding-left: 2.5rem; width: 100%;">
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
            <input type="checkbox" style="accent-color: var(--primary);"> Remember me
          </label>
          <a href="#" style="color: var(--primary); text-decoration: none; transition: color 0.2s;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: var(--radius-md);">
          Sign In <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
        Aura POS v1.0.0 &copy; 2026. All rights reserved.
      </div>
    </div>
  </div>

</body>
</html>
