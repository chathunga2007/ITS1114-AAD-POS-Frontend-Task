<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <script src ="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

<div class="container">
    <h2>Sign Up Form</h2>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">User Name</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password_1">Password</label>
            <input type="password" id="password_1" name="password_1" required>
        </div>
        <div class="form-group">
            <label for="password_2">Confirm Password</label>
            <input type="password" id="password_2" name="password_2" required>
        </div>
        <div class="form-group">
            <label for="userRoles">User Roles</label>
            <input type="text" id="userRoles" name="userRoles" required placeholder="e.g. ADMIN, USER">
        </div>
        <p id="signup-error-msg" style="color: red; font-size: 0.875rem; display: none;"></p>
        <button type="button" onclick="handleSignUp()">Sign Up</button>
        <div class="form-footer">
            Already have an account? <a href="Login.html">Login</a>
        </div>
    </form>
</div>

<script>

    function handleSignUp(){
        let username = $('#username').val().trim();
        let password_1 = $('#password_1').val().trim();
        let password_2 = $('#password_2').val().trim();
        let userRoles = $('#userRoles').val();

        if(password_1==="" || password_1!==password_2){
            let errorMsg = $('#signup-error-msg');
            errorMsg.show().text("Passwords do not match or are empty.");
            return;
        }

        const obj = JSON.stringify({
            "username": username,
            "password": password_1,
            "userRoles": userRoles 
        });

        console.log(localStorage.getItem("JWT"))


        $.ajax({
           url:"http://localhost:8080/api/test/saveUser",
           type:'POST',
           contentType:'application/json',
           data:obj,
           headers:{
               'Authorization':'Bearer '+localStorage.getItem("JWT")
           },
           success:function (response){
               console.log(response)
               alert(response.message || "User created successfully!")
               window.location.href = "Login.html";
           },
           error:function (response){
               alert(response.message)
           }
        });
    }
</script>

</body>
</html>
