<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimsara POS - Dashboard</title>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Shared CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">B</div>
        <span class="logo-text">Bimsara POS</span>
      </div>
      
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link active">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a href="customers.html" class="nav-link">
          <i class="bi bi-people-fill"></i>
          <span>Customers</span>
        </a>
        <a href="items.html" class="nav-link">
          <i class="bi bi-box-seam-fill"></i>
          <span>Items</span>
        </a>
        <a href="orders.html" class="nav-link">
          <i class="bi bi-cart-fill"></i>
          <span>Place Order</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar">AD</div>
        <div class="user-info">
          <span class="user-name">Admin User</span>
          <span class="user-role">Manager</span>
        </div>
        <a href="login.html" class="logout-btn" title="Logout">
          <i class="bi bi-box-arrow-right" style="font-size: 1.15rem;"></i>
        </a>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Header -->
      <header class="main-header" style="justify-content: flex-start;">
        <div class="header-title">
          <h1>Dashboard Overview</h1>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        <!-- Stats Cards Grid -->
        <div class="grid grid-cols-4" style="margin-bottom: 2rem;">
          
          <!-- Card 1 -->
          <div class="card stat-card" style="padding-bottom: 1.5rem;">
            <div class="stat-header">
              <span class="stat-title">Total Revenue</span>
              <div class="stat-icon-wrapper success">
                <i class="bi bi-currency-dollar" style="font-size: 1.25rem;"></i>
              </div>
            </div>
            <div class="stat-value" style="margin-bottom: 0;">$1,250.00</div>
          </div>

          <!-- Card 2 -->
          <div class="card stat-card" style="padding-bottom: 1.5rem;">
            <div class="stat-header">
              <span class="stat-title">Orders Processed</span>
              <div class="stat-icon-wrapper primary">
                <i class="bi bi-bag-check-fill" style="font-size: 1.25rem;"></i>
              </div>
            </div>
            <div class="stat-value" style="margin-bottom: 0;">12</div>
          </div>

          <!-- Card 3 -->
          <div class="card stat-card" style="padding-bottom: 1.5rem;">
            <div class="stat-header">
              <span class="stat-title">Active Customers</span>
              <div class="stat-icon-wrapper warning">
                <i class="bi bi-people-fill" style="font-size: 1.25rem;"></i>
              </div>
            </div>
            <div class="stat-value" style="margin-bottom: 0;">4</div>
          </div>

          <!-- Card 4 -->
          <div class="card stat-card" style="padding-bottom: 1.5rem;">
            <div class="stat-header">
              <span class="stat-title">Total Products</span>
              <div class="stat-icon-wrapper danger">
                <i class="bi bi-box-seam-fill" style="font-size: 1.25rem;"></i>
              </div>
            </div>
            <div class="stat-value" style="margin-bottom: 0;">8</div>
          </div>

        </div>

        <!-- Recent Transactions Table -->
        <div class="table-container">
          <div class="table-header">
            <h3>Recent Transactions</h3>
            <a href="orders.html" class="btn btn-primary btn-sm">
              <i class="bi bi-plus-lg"></i> New Order
            </a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Date</th>
                  <th>Total</th>
                  <th>Payment</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <!-- Transactions will be injected here -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>
</body>
</html>
